services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nexuseats-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexuseats-api:prod
    container_name: nexuseats-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://nexuseats:nexuseats_dev@postgres:5432/nexuseats
      JWT_SECRET: nexuseats-secret-key-2026
      RABBITMQ_URL: amqp://nexuseats:secret@rabbitmq:5672
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nexuseats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexuseats
      POSTGRES_PASSWORD: nexuseats_dev
      POSTGRES_DB: nexuseats
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuseats -d nexuseats"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: nexuseats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexuseats-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nexuseats
      RABBITMQ_DEFAULT_PASS: secret
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
